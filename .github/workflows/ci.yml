name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prototype-smoke-test:
    name: Prototype end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run prototype/demo.py (all assertions)
        working-directory: prototype
        run: python demo.py
